# =============================================================================
# FAMILY ROOM CO2 NODE  —  Family room (1F), on a shelf
# -----------------------------------------------------------------------------
# This file holds NOTHING but substitutions and this node's own API key. All
# behaviour is in co2-node-common.yaml, which both CO2 nodes share byte for byte.
#
# Not yet here: wifi: use_address. Until it holds this node's DHCP reservation,
# the Device Builder reaches it as family-room-co2-node.local, which the add-on's
# container cannot resolve (see basement-th-node.yaml). First flash is over USB
# either way.
# =============================================================================

substitutions:
  node_name: family-room-co2-node
  friendly: Family Room CO2 Node

api:
  encryption:
    key: !secret api_key_family_room_co2_node

packages:
  common: !include co2-node-common.yaml
